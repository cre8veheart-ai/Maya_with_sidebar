name: Deploy Preview to Vercel

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Permission infiltration audit
        run: npm run test:permissions

      - name: Executive security gauntlet
        run: npm run test:security

      - name: Model black-box honeypot gate
        run: npm run test:blackbox

      - name: Lint
        run: npm run lint

      - name: Production gate tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy Preview to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          github-comment: false
