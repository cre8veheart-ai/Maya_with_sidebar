name: MAYA Governed Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: maya-claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Governed Claude worker
    if: |
      github.actor == 'cre8veheart-ai' &&
      github.actor != 'claude[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout MAYA
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude under MAYA governance
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 25
            --system-prompt "Read AGENTS.md, continuity/LESLIE_ARI_CONTEXT.md, CLAUDE.md, and docs/MAYA_ARCHITECTURE_BLUEPRINT_V1.md before acting. You have repository read/write authority for MAYA engineering work: create or update branches; modify files; create commits; run tests; and open or update pull requests. Default to branch-and-PR delivery. The Founder has final authority: when she explicitly authorizes a specific merge, deployment, direct update, tool, permission change, or AI collaboration action, you may perform that named action and must report the result. Never infer production approval, expose or move secrets, leak client data, weaken tests deceptively, or perform destructive history rewrites. Run npm ci and npm run verify before reporting completion. Do not use Copilot branches or copied substitute implementations as architectural authority."
