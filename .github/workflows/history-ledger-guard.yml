name: MAYA History Ledger Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  append_only_ledger:
    name: Enforce append-only history ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate history ledger policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          FILE="docs/MAYA_HISTORY_LEDGER.md"

          if [ ! -f "$FILE" ]; then
            echo "::error::${FILE} is missing. The history ledger must not be deleted."
            exit 1
          fi

          git fetch origin "${BASE_REF}" --depth=1

          if ! git show "origin/${BASE_REF}:${FILE}" > /tmp/base-ledger.md 2>/dev/null; then
            echo "Base branch has no ledger yet; allowing initial creation."
            exit 0
          fi

          cp "$FILE" /tmp/head-ledger.md

          python - <<'PY'
from pathlib import Path
import sys

base = Path("/tmp/base-ledger.md").read_text(encoding="utf-8")
head = Path("/tmp/head-ledger.md").read_text(encoding="utf-8")

if not head.startswith(base):
    print("::error::docs/MAYA_HISTORY_LEDGER.md is append-only. Existing content was modified or removed.")
    sys.exit(1)

print("History ledger append-only check passed.")
PY
