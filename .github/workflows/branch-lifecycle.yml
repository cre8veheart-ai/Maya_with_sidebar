name: MAYA Branch Lifecycle Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Report branches without deleting them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Branch lifecycle is review-only. No branch is deleted automatically."
          gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name'
